name: iOS Build Test

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
      
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: List available simulators
      run: xcrun simctl list devices available
      
    - name: Check for Xcode project
      id: check_project
      run: |
        if [ -f "LemonMath/LemonMath.xcodeproj/project.pbxproj" ]; then
          echo "project_exists=true" >> $GITHUB_OUTPUT
        elif [ -f "LemonMath/Package.swift" ]; then
          echo "project_exists=false" >> $GITHUB_OUTPUT
          echo "package_exists=true" >> $GITHUB_OUTPUT
        else
          echo "project_exists=false" >> $GITHUB_OUTPUT
          echo "package_exists=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Build iOS app (Xcode project)
      if: steps.check_project.outputs.project_exists == 'true'
      run: |
        cd LemonMath
        xcodebuild clean build \
          -scheme LemonMath \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -sdk iphonesimulator \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
          
    - name: Build Swift Package for iOS
      if: steps.check_project.outputs.package_exists == 'true'
      run: |
        cd LemonMath
        xcodebuild build \
          -scheme LemonMath \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -sdk iphonesimulator \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          2>&1 | tee build.log

        # Show any errors from the log
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "❌ Build failed. Showing errors:"
          grep -A 5 "error:" build.log || true
          exit 1
        fi
        echo "✅ Swift package builds successfully for iOS"
        
    - name: Run tests (if available)
      if: steps.check_project.outputs.project_exists == 'true'
      run: |
        cd LemonMath
        xcodebuild test \
          -scheme LemonMath \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -sdk iphonesimulator \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO || echo "No tests found - continuing"
          
    - name: Note about Xcode project
      if: steps.check_project.outputs.project_exists == 'false'
      run: |
        echo "⚠️  No Xcode project found. Create one with:"
        echo "1. Open Xcode"
        echo "2. File > New > Project > iOS App"
        echo "3. Add existing Swift files"
        echo "4. Configure build settings"
          
    - name: Archive build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: |
          LemonMath/build/
        retention-days: 7

